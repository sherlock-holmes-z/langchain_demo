  # conda env update --name langchain-demo --file environment.yml --prune
  - python=3.12
  - pip
  - setuptools=84.0.0
  - wheel=0.48.0
  - pip:
      - langchain==1.4.0
      - langchain-deepseek==1.1.0
      - langchain-openai==1.6.2
      - openai==3.14.1
      - python-dotenv==1.2.3
      - rich==15.0.0
      - ipykernel==7.3.0
      - mypy==2.3.1
      - pytest==9.1.1
      - pytest-asyncio==1.4.0
      - ruff==0.16.8
